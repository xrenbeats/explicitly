        PRODUCT_BUNDLE_IDENTIFIER: com.xren.explicitmusictools
        PRODUCT_NAME: Explicitly
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
